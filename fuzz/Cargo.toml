[package]
name = "tui-chart-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
ratatui = { version = "0.30", default-features = false }
serde_json = "1"
tui-chart = { path = "..", features = ["serde"] }

# Not part of the main crate (needs nightly).
[workspace]

[[bin]]
name = "render_line"
path = "fuzz_targets/render_line.rs"
test = false
doc = false

[[bin]]
name = "render_candles"
path = "fuzz_targets/render_candles.rs"
test = false
doc = false

[[bin]]
name = "render_misc"
path = "fuzz_targets/render_misc.rs"
test = false
doc = false

[[bin]]
name = "timeaxis"
path = "fuzz_targets/timeaxis.rs"
test = false
doc = false

[[bin]]
name = "indicators"
path = "fuzz_targets/indicators.rs"
test = false
doc = false

[[bin]]
name = "theme_json"
path = "fuzz_targets/theme_json.rs"
test = false
doc = false
