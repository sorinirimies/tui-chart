[[example]]
name = "histogram"
path = "examples/histogram.rs"
required-features = ["theme"]

[[example]]
name = "heatmap"
path = "examples/heatmap.rs"
required-features = ["theme"]

[[example]]
name = "showcase"
path = "examples/showcase.rs"
required-features = ["theme"]

[[example]]
name = "sparkline"
path = "examples/sparkline.rs"
required-features = ["theme"]

[[example]]
name = "gauge"
path = "examples/gauge.rs"
required-features = ["theme"]

[[example]]
name = "radar"
path = "examples/radar.rs"
required-features = ["theme"]

[[example]]
name = "boxplot"
path = "examples/boxplot.rs"
required-features = ["theme"]

[[example]]
name = "waterfall"
path = "examples/waterfall.rs"
required-features = ["theme"]

[[example]]
name = "gantt"
path = "examples/gantt.rs"
required-features = ["theme"]

[[example]]
name = "depth"
path = "examples/depth.rs"
