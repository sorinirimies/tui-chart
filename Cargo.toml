[package]
name = "tui-chart"
version = "0.1.1"
edition = "2021"
authors = ["Sorin Irimies <sorinirimies@gmail.com>"]
license = "MIT"
description = "Terminal chart widgets for ratatui: line, bar, candlestick, histogram, heatmap, gauge, radar, treemap and more, with themes, annotations and streaming"
repository = "https://github.com/sorinirimies/tui-chart"
readme = "README.md"
keywords = ["tui", "chart", "ratatui", "candlestick", "plot"]
categories = ["command-line-interface", "visualization", "rendering"]
rust-version = "1.88.0"
exclude = [
    ".gitea/**",
    ".github/**",
    ".zed/**",
    "fuzz/**",
    "scripts/**",
    "examples/vhs/**",
    "docs/**",
    "examples/vhs/**",
    "scripts/**",
    "cliff.toml",
    "justfile",
]

[dependencies]
ratatui = { version = "0.30", default-features = false }
unicode-width = "0.2"
serde = { version = "1", features = ["derive"], optional = true }
# Shared theme crate; switch to the crates.io version after it is published.
tui-nuances = { version = "0.1.6", optional = true }

[features]
default = []
# Opt-in theming: `Theme`, `.theme(..)` builders on every widget, `Themed` impls.
theme = ["dep:tui-nuances"]
# Derive Serialize/Deserialize on data types (and on Theme when `theme` is on).
serde = ["dep:serde", "ratatui/serde", "tui-nuances?/serde"]

[dev-dependencies]
anyhow = "1.0"
serde_json = "1"
crossterm = "0.29"
ratatui = { version = "0.30", features = ["crossterm"] }

[[example]]
name = "line"
path = "examples/line.rs"
required-features = ["theme"]

[[example]]
name = "candlestick"
path = "examples/candlestick.rs"
required-features = ["theme"]

[[example]]
name = "bars"
path = "examples/bars.rs"
